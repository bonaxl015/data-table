name: DataTable CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    name: Build and Run Unit Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'yarn'

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Run unit tests
      run: yarn test

    - name: Build the library
      run: yarn build

  publish:
    name: Bump Version and Publish
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'yarn'
          registry-url: https://registry.npmjs.org/
          scope: '@bonaxl015'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Bump version
        id: bump
        run: |
          NEW_VERSION=$(npm version patch -m "chore: release v%s" | sed 's/^v//')
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Push version commit and tag
        run: |
          git push origin HEAD:master --follow-tags

      - name: Build the library
        run: yarn build

      - name: Check if version already exists
        id: check-version
        run: |
          PACKAGE_NAME="@bonaxl015/data-table"
          VERSION="${{ steps.bump.outputs.version }}"

          echo "Checking if $PACKAGE_NAME@$VERSION already exists..."
          if npm view "$PACKAGE_NAME@$VERSION" version --registry=https://registry.npmjs.org/ > /dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to NPM
        if: steps.check-version.outputs.skip == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
