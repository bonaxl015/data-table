name: DataTable CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    name: Build and Run Unit Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'yarn'

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Run unit tests
      run: yarn test

    - name: Build the library
      run: yarn build

  version:
    name: Bump Version
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push'
    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout master

      - name: Bump patch version
        id: bump
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          NEW_VERSION=$(npm version patch -m "chore: bump version to %s" | sed 's/^v//')
          echo "New version: $NEW_VERSION"

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Push version bump commit and tag
        run: |
          git push origin HEAD:master --follow-tags

  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    needs: [version, test]
    if: github.event_name == 'push'

    steps:
      - name: CHeckout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'yarn'
          registry-url: https://npm.pkg.github.com/
          scope: '@bonaxl015'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build the library
        run: yarn build

      - name: Get version from version tag
        id: get-version
        run: |
          VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
          echo "Version from git tag: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if version already exists
        id: check-version
        run: |
          PACKAGE_NAME="@bonaxl015/data-table"
          VERSION=${{ steps.get-version.outputs.version }}
          echo "Checking if version $VERSION of $PACKAGE_NAME exists..."

          if npm view "$PACKAGE_NAME@$VERSION" version --registry=https://npm.pkg.github.com/ > /dev/null 2>&1; then
            echo "Version $VERSION already exists on GitHub Packages. Skipping publish."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION does not exist. Proceeding to publish."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to GitHub Packages
        if: steps.check-version.outputs.skip == 'false'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    